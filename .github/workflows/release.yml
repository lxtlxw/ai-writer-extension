name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create extension zip
        run: |
          mkdir -p dist
          zip -r dist/ai-writer-extension.zip . \
            -x ".git/*" ".github/*" "dist/*" "*.zip" "scripts/generate-icons.js" "package.json"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ai-writer-extension.zip
          generate_release_notes: true

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 爆款文案 - 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f0f5;
      color: #1a1a2e;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 24px; margin-bottom: 24px; color: #1a1a2e; }
    h2 { font-size: 16px; margin: 20px 0 10px; color: #444; }
    p { font-size: 13px; color: #666; margin-bottom: 16px; line-height: 1.6; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      font-family: inherit;
    }
    input:focus { outline: none; border-color: #6c5ce7; }
    .btn {
      padding: 10px 24px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #5a4bd1; }
    .btn.secondary {
      background: #e0e0e0;
      color: #333;
    }
    .btn.secondary:hover { background: #d0d0d0; }
    .status { font-size: 13px; padding: 8px 0; }
    .status.success { color: #059669; }
    .status.error { color: #dc2626; }
    .divider { border: none; border-top: 1px solid #e0e0e0; margin: 24px 0; }
    .pro-section {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .pro-section h3 { color: #92400e; margin-bottom: 8px; }
    .inline-group { display: flex; gap: 8px; align-items: flex-start; }
    .inline-group input { flex: 1; }
    .inline-group .btn { flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ AI 爆款文案 设置</h1>

    <!-- API 设置 -->
    <h2>🔑 API 配置</h2>
    <p>需要 Claude API Key 才能使用。在 <a href="https://console.anthropic.com/" target="_blank">Anthropic Console</a> 获取。</p>
    <label for="apiKey">Claude API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-xxxxxxxxxxxx" autocomplete="off">
    <div class="inline-group">
      <button id="saveApiKey" class="btn">保存 API Key</button>
      <button id="testApiKey" class="btn secondary">测试连接</button>
    </div>
    <div id="apiStatus" class="status"></div>

    <hr class="divider">

    <!-- Pro 升级 -->
    <h2>⭐ Pro 会员</h2>
    <div class="pro-section">
      <h3>Pro 会员权益</h3>
      <p>✅ 无限字数（免费版限制500字）<br>
         ✅ 批量生成模式<br>
         ✅ 全部模板和语气选项<br>
         ✅ 无水印导出<br>
         ✅ 优先技术支持</p>
      <p><strong>价格：</strong>$9.99/月 或 $99/年</p>
    </div>
    <label for="licenseKey">Pro 许可证密钥</label>
    <div class="inline-group">
      <input type="text" id="licenseKey" placeholder="输入许可证密钥">
      <button id="activateLicense" class="btn">激活</button>
    </div>
    <div id="licenseStatus" class="status"></div>
    <p style="font-size:12px;">
      还没有许可证？
      <a href="#" id="buyLicense">立即购买 →</a>
    </p>

    <hr class="divider">

    <!-- 关于 -->
    <h2>📦 关于</h2>
    <p>
      版本 1.0.0<br>
      基于 Claude API 驱动<br>
      数据仅保存在本地浏览器中，不会上传到我们的服务器。
    </p>
    <p style="color:#999; font-size:12px; margin-top:12px;">
      Made with ❤️
    </p>
  </div>
  <script src="options.js"></script>
</body>
</html>
